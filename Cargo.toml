[package]
name = "wait-file"
license = "GPL-3.0-or-later"
version = "0.1.0"
edition = "2024"
keywords = ["inotify"]
description = "cli utility to monitor for changes in one or multiple files"
homepage = "https://gitlab-ext.sigma-chemnitz.de/ensc/wait-file"
repository = "https://github.com/ensc/wait-file"

[dependencies]
cargo = { version = "0.93.0", optional = true }
clap = { version = "4.5.53", features = ["derive"] }
env_logger = "0.11.8"
humantime = "2.3.0"
inotify = { version = "0.11.0", default-features = false }
log = "0.4.29"
rustix = { version = "1.1.3", features = ["event", "process"] }

[dev-dependencies]
tempfile = "3.24.0"

[features]
# default = ["cargo"]
cargo = ["dep:cargo"]
